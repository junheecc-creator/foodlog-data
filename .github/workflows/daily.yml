# 매일 06:00 KST(21:00 UTC) — CostApp 의 발행기(scripts/publish/publishData.js)를 돌려 시세 JSON 을 이 저장소에 커밋한다.
# 규칙·보안 = CostApp/docs/계획/자동갱신-보안.md · 필요한 Secrets = SECRETS.md
# ⛔ 액션은 전부 커밋 SHA 로 고정한다(태그는 바꿔치기가 가능하다). 올리는 건 dependabot PR 로.
name: daily

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write   # 시세 JSON 커밋·push
  actions: write    # 연속 실패 시 스스로 끄기(gh workflow disable)

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout foodlog-data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true   # 아래 push 가 github.token 을 쓴다

      - name: checkout foodlog(CostApp) (읽기 전용 PAT)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: junheecc-creator/foodlog
          token: ${{ secrets.COSTAPP_READ_TOKEN }}
          path: costapp
          persist-credentials: false  # 발행기가 CostApp 에 쓰는 일은 없다

      - name: setup node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      # 발행기·수집기는 Node 내장 모듈(fs·fetch)만 쓴다 → npm ci 없음 (공급망 면적 0)

      - name: publish
        working-directory: costapp
        env:
          DATAGO_KEY: ${{ secrets.DATAGO_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FOODLOG_DATA_DIR: ${{ github.workspace }}
        run: |
          git -C "$FOODLOG_DATA_DIR" config user.name  "github-actions[bot]"
          git -C "$FOODLOG_DATA_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/publish/publishData.js --garak-only --notify
      # commit·push 는 발행기 안에서 한다(검증 관문 통과 뒤에만). 변경 없으면 커밋하지 않는다.

      - name: 연속 실패면 스스로 끈다
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 이번 실행 제외 직전 2개가 모두 실패면(= 3연속) 워크플로를 끈다. 켜는 법 = 자동갱신-보안.md 「사고 대응」
          prev=$(gh run list --workflow daily.yml --status completed --limit 2 --json conclusion --jq '[.[].conclusion] | join(",")')
          echo "직전 2개: $prev"
          if [ "$prev" = "failure,failure" ]; then
            gh workflow disable daily.yml
            msg="[foodlog-data] 3연속 실패 → daily.yml 을 껐습니다. Actions 탭에서 원인 확인 후 Enable workflow."
          else
            msg="[foodlog-data] 실패: $(cat costapp/publish-summary.txt 2>/dev/null || echo '요약 없음') · $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
          echo "$msg"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -sS -o /dev/null -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=$msg" || true
          fi

      - name: 발행 기록 한 줄 (성공·실패·취소 모두 · W-021 O-6)
        if: always()
        run: |
          # publish-log.tsv = 날짜시각(KST) · 결과 · 발행기 요약 한 줄 · 실행 주소. 주간 security 작업이 마지막 줄 날짜로 "멈춤"을 알린다.
          line=$(printf '%s\t%s\t%s\t%s' "$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')" "${{ job.status }}" "$(head -1 costapp/publish-summary.txt 2>/dev/null || echo 요약없음)" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          echo "$line"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f publish-log.tsv ] || printf '시각(KST)\t결과\t요약\t실행\n' > publish-log.tsv
          echo "$line" >> publish-log.tsv
          git add publish-log.tsv
          git commit -m "log $(TZ=Asia/Seoul date +%F) ${{ job.status }}" || true
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && break; sleep 5; done || true
