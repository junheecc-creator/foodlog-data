# 접속 시험 (W-003 1-1 · 2026-10-15) — GitHub 서버에서 발행기와 같은 호출(999줄)이 되는지 본다. 열쇠 값은 마스킹. 끝나면 지운다.
name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 20 }
      - name: node fetch 크기별
        env: { DATAGO_KEY: "${{ secrets.DATAGO_KEY }}" }
        run: |
          node -e '
            const K=process.env.DATAGO_KEY;
            const url=(n,p)=>`https://apis.data.go.kr/B552845/katSale/trades?serviceKey=${K}&returnType=JSON&numOfRows=${n}&pageNo=${p}&cond[whsl_mrkt_cd::EQ]=110001&cond[trd_clcln_ymd::EQ]=2026-10-13`;
            (async()=>{ for (const [n,p] of [[1,1],[100,1],[300,1],[999,1],[999,2]]) {
              const t0=Date.now();
              try { const r=await fetch(url(n,p)); const t=await r.text(); let ok=false,cnt="-"; try{const j=JSON.parse(t); ok=true; cnt=(j.response.body.items.item||[]).length}catch{}
                console.log(`rows=${n} page=${p} → HTTP ${r.status} · ${((Date.now()-t0)/1000).toFixed(1)}s · ${t.length}자 · JSON ${ok?"OK":"깨짐"} · item ${cnt} · 머리: ${t.split(K).join("***").slice(0,80).replace(/\s+/g," ")}`) }
              catch(e){ console.log(`rows=${n} page=${p} → 실패 ${((Date.now()-t0)/1000).toFixed(1)}s · ${String(e.cause||e).slice(0,200)}`) }
            } })()'
